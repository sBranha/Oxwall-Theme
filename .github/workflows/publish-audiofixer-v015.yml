name: Publish Audio Fixer 0.1.5

on:
  push:
    paths:
      - '.github/workflows/publish-audiofixer-v015.yml'
      - 'audio-fixer/release-trigger-v015.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download built Audio Fixer artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://sdmntpritalynorth.oaiusercontent.com/files/00000000-553c-8246-8b8a-dd1804949ed5/raw?se=2026-09-11T17%3A01%3A58Z&sp=r&sv=2026-02-06&sr=b&scid=4cf65f13-faac-5b6c-8189-b0dc0680ea4e&skoid=77636ecc-ad8d-44df-baa7-163b524a0261&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-11T12%3A12%3A28Z&ske=2026-09-12T12%3A12%3A28Z&sks=b&skv=2026-02-06&sig=BRMUO%2BFFgCrFwjFAk5WromZXeh6dbS1aqg6begFQbaI%3D' -o artifact.zip
          unzip -o artifact.zip -d artifact
          DMG="$(find artifact -type f -name '*.dmg' | head -n 1)"
          test -n "$DMG"
          cp "$DMG" AudioFixer-0.1.5-macOS-AppleSilicon.dmg
      - name: Publish public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v0.1.5 >/dev/null 2>&1 || gh release create v0.1.5 --repo "$GITHUB_REPOSITORY" --title 'Audio Fixer 0.1.5' --notes 'Returns Audio Fixer to orange and makes selected Audio Fix and Voice Changer options orange with dark text.'
          gh release upload v0.1.5 AudioFixer-0.1.5-macOS-AppleSilicon.dmg --repo "$GITHUB_REPOSITORY" --clobber
