name: Publish Audio Fixer 0.1.8

on:
  push:
    paths:
      - '.github/workflows/publish-audiofixer-v018.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download built Audio Fixer artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-3648-81f5-aa9a-34e099e623fa/raw?se=2026-09-11T23%3A07%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=11220e95-c784-5df6-8aec-9c8ca842455b&skoid=77636ecc-ad8d-44df-baa7-163b524a0261&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-11T02%3A21%3A34Z&ske=2026-09-12T02%3A21%3A34Z&sks=b&skv=2026-02-06&sig=zGEV9B2kQIvCDLKwbYNWLgKGC1gfmIdex7hEQIUvcH8%3D' -o artifact.zip
          unzip -o artifact.zip -d artifact
          DMG="$(find artifact -type f -name '*.dmg' | head -n 1)"
          test -n "$DMG"
          cp "$DMG" AudioFixer-0.1.8-macOS-AppleSilicon.dmg
      - name: Publish public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v0.1.8 >/dev/null 2>&1 || gh release create v0.1.8 --repo "$GITHUB_REPOSITORY" --title 'Audio Fixer 0.1.8' --notes 'AI Music Remover / Vocal Isolator 2.0. Adds a true Demucs stem-separation BEST mode for keeping vocals/voice while removing instrumental accompaniment. The original fast speech cleanup remains available.'
          gh release upload v0.1.8 AudioFixer-0.1.8-macOS-AppleSilicon.dmg --repo "$GITHUB_REPOSITORY" --clobber
