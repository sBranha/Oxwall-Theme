name: Publish Audio Fixer 0.1.4

on:
  push:
    paths:
      - '.github/workflows/publish-audiofixer-v014.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download built Audio Fixer artifact
        shell: bash
        run: |
          set -euo pipefail
          curl -L --fail --retry 3 'https://sdmntprsoutheastus3.oaiusercontent.com/files/00000000-67a0-820c-b01d-a199dd725bca/raw?se=2026-09-11T16%3A48%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=1e9e048b-53b7-56ba-af6e-fbc534435a72&skoid=77636ecc-ad8d-44df-baa7-163b524a0261&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-11T02%3A08%3A47Z&ske=2026-09-12T02%3A08%3A47Z&sks=b&skv=2026-02-06&sig=3CNheBSTUFLWVvW5XQfavKgeh4%2BSsO2c5FnYer1etCU%3D' -o artifact.zip
          unzip -o artifact.zip -d artifact
          find artifact -maxdepth 3 -type f -print
          DMG="$(find artifact -type f -name '*.dmg' | head -n 1)"
          test -n "$DMG"
          cp "$DMG" AudioFixer-0.1.4-macOS-AppleSilicon.dmg
      - name: Publish public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v0.1.4 >/dev/null 2>&1 || gh release create v0.1.4 --title 'Audio Fixer 0.1.4' --notes 'Red theme updater test for Audio Fixer macOS.'
          gh release upload v0.1.4 AudioFixer-0.1.4-macOS-AppleSilicon.dmg --clobber
